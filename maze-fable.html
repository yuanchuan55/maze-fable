<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no">
<title>迷宫寓言</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#020817;color:#e5edf7;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
main{max-width:1100px;margin:auto;padding:16px}.head{border-bottom:1px solid #334155;padding-bottom:12px}.head h1{margin:0;font-size:30px;letter-spacing:.15em}.muted{color:#94a3b8;font-size:13px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill,.panel{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px 12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px}.board{border:1px solid #334155;border-radius:10px;overflow:hidden;background:#0f172a}.board canvas{display:block;width:100%;height:auto}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}button{border:1px solid #475569;border-radius:9px;background:#1e293b;color:#f1f5f9;padding:12px;cursor:pointer;font-size:15px;touch-action: manipulation;}button.primary{background:#fbbf24;color:#111827;border-color:#fbbf24;font-weight:700}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:260px;margin:12px auto}.pad button{font-size:22px}.panel{margin-bottom:10px}.panel h3{font-size:15px;margin:0 0 10px}.big{font-size:30px;font-weight:750}.log{font-size:12px;color:#94a3b8;max-height:150px;overflow:auto;line-height:1.7}.bottom{margin-top:12px}@media(max-width:760px){main{padding:10px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.panel{margin:0}.head h1{font-size:25px}}
</style>
</head>
<body><main>
<header class="head"><h1>迷宫寓言</h1><div class="muted">上一代走到哪里，下一代便从哪里继续。每条走过的路，都是后来者的地图。</div></header>
<div class="stats">
<div class="pill">探索者 <b id="gen">1 号</b></div><div class="pill">该名角色剩余时间 <b id="time">20.0</b> 秒</div><div class="pill">已探索 <b id="reveal">0%</b></div>
</div>
<div class="layout"><section>
<div class="board"><canvas id="maze"></canvas></div><div class="muted" id="pos" style="margin-top:7px">当前位置：—</div>
<div class="pad"><div></div><button data-dir="0,-1">↑</button><div></div><button data-dir="-1,0">←</button><button data-dir="0,1">↓</button><button data-dir="1,0">→</button></div>
<div class="buttons"><button class="primary" id="start">▶ 开始</button><button id="pause">Ⅱ 暂停</button><button id="new">↻ 新迷宫</button></div>
<div class="muted" style="margin-top:8px">方向键 / WASD 控制。每名角色存续 20 秒。地图、路径和探索标记由所有世代共同继承。</div>
</section><aside class="side">
<div class="panel"><h3>当前角色</h3><div class="big" id="symbol" style="color:#38bdf8">▲</div><div id="style" class="muted">三角形 · 蓝色</div><div style="margin-top:8px">剩余时间</div><div class="big" id="time2">20.0 秒</div><div class="muted" id="status">等待开始</div></div>
<div class="panel"><h3>全局统计</h3><div class="muted">地图尺寸：39 × 27</div><div style="margin-top:7px">累计步数：<b id="steps">0</b></div><div style="margin-top:7px">已接力世代：<b id="count">1</b></div></div>
<div class="panel" style="grid-column:1/-1"><h3>探索日志</h3><div id="log" class="log"></div></div>
</aside></div>
<div class="bottom muted">提示：走进死胡同并不一定是白费力气——如果留下记录，后来者就知道这条路不通。</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('maze'),ctx=canvas.getContext('2d');
const W=39,H=27,C=20,LIFE=20,colors=['#38bdf8','#fb923c','#4ade80','#2dd4bf','#e879f9','#fb7185','#c084fc','#facc15'],shapes=['▲','●','◆','■','★','⬟','⬢','✦'],names=['三角形','圆形','菱形','方形','星形','五边形','六边形','星芒形'],colorNames=['蓝色','橙色','绿色','青色','粉色','红色','紫色','金色'];
canvas.width=W*C;canvas.height=H*C;
let maze,seen,owner,x,y,gen,time,steps,running,won,log,marks,last=0;
function rand(n){return Math.floor(Math.random()*n)}
function generate(){maze=Array.from({length:H},()=>Array(W).fill(1));let st=[[1,1]];maze[1][1]=0;
while(st.length){let[a,b]=st[st.length-1],o=[];for(let[dx,dy]of[[0,-2],[2,0],[0,2],[-2,0]]){let nx=a+dx,ny=b+dy;if(nx>0&&ny>0&&nx<W-1&&ny<H-1&&maze[ny][nx]===1)o.push([nx,ny,dx,dy])}
if(!o.length){st.pop();continue}let[nx,ny,dx,dy]=o[rand(o.length)];maze[b+dy/2][a+dx/2]=0;maze[ny][nx]=0;st.push([nx,ny])}
for(let i=0;i<Math.floor(W*H*.002);i++){let a=1+rand(W-2),b=1+rand(H-2);if(maze[b][a]===1&&((maze[b][a-1]===0&&maze[b][a+1]===0)||(maze[b-1][a]===0&&maze[b+1][a]===0)))maze[b][a]=0}maze[H-2][W-2]=0}
function reveal(){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(Math.abs(dx)+Math.abs(dy)>1)continue;let a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<W&&b<H)seen[b][a]=true}}
function note(s){log.unshift(s);log=log.slice(0,12);$('log').innerHTML=log.map(v=>'<div>› '+v+'</div>').join('')}
function fresh(){generate();seen=Array.from({length:H},()=>Array(W).fill(false));owner=Array.from({length:H},()=>Array(W).fill(0));x=1;y=1;gen=1;time=LIFE;steps=0;running=false;won=false;log=[];marks=[];owner[y][x]=gen;reveal();note('1 号探索者从入口出发。');note('新迷宫生成：小心岔路和死胡同。');render()}
function move(dx,dy){if(!running||won)return;let nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H||maze[ny][nx]===1)return;x=nx;y=ny;steps++;owner[y][x]=gen;reveal();if(x===W-2&&y===H-2){won=true;running=false;note(gen+' 号探索者找到了出口！接力成功。')}render()}
function handoff(){marks.push({x,y,n:gen});note(gen+' 号时间耗尽，在坐标 ('+x+','+y+') 留下记录。');gen++;time=LIFE;owner[y][x]=gen;reveal();note(gen+' 号从上一代的位置接续探索。');render()}
function marker(px,py,n,scale){let i=(n-1)%colors.length;ctx.save();ctx.translate(px,py);ctx.fillStyle=colors[i];ctx.strokeStyle='#e0f2fe';ctx.lineWidth=1.5;ctx.shadowColor=colors[i];ctx.shadowBlur=9;ctx.beginPath();if(i===0){ctx.moveTo(0,-7*scale);ctx.lineTo(7*scale,6*scale);ctx.lineTo(-7*scale,6*scale);ctx.closePath()}else if(i===1)ctx.arc(0,0,6.5*scale,0,Math.PI*2);else if(i===2){ctx.moveTo(0,-7*scale);ctx.lineTo(7*scale,0);ctx.lineTo(0,7*scale);ctx.lineTo(-7*scale,0);ctx.closePath()}else if(i===3)ctx.rect(-6*scale,-6*scale,12*scale,12*scale);else ctx.arc(0,0,6.5*scale,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#07111f';ctx.font='bold '+Math.max(9,10*scale)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(n),0,.5);ctx.restore()}
function render(){ctx.fillStyle='#030a16';ctx.fillRect(0,0,canvas.width,canvas.height);
for(let b=0;b<H;b++)for(let a=0;a<W;a++){let px=a*C,py=b*C;if(!seen[b][a]){ctx.fillStyle='#07101f';ctx.fillRect(px,py,C,C);continue}if(maze[b][a]===1){ctx.fillStyle='#34465c';ctx.fillRect(px,py,C,C);ctx.fillStyle='#40556c';ctx.fillRect(px+2,py+2,C-4,C-4);ctx.strokeStyle='#243449';ctx.strokeRect(px+1,py+1,C-2,C-2)}else{ctx.fillStyle='#15283c';ctx.fillRect(px,py,C,C);ctx.fillStyle='#1c344b';ctx.fillRect(px+3,py+3,C-6,C-6);if(owner[b][a]>0){ctx.fillStyle=colors[(owner[b][a]-1)%colors.length]+'66';ctx.fillRect(px+5,py+5,C-10,C-10)}}}
for(let m of marks)if(seen[m.y][m.x])marker(m.x*C+C/2,m.y*C+C/2,m.n,.78);
if(seen[H-2][W-2]||won){let ex=(W-2)*C+C/2,ey=(H-2)*C+C/2;ctx.fillStyle='#facc15';ctx.shadowColor='#facc15';ctx.shadowBlur=15;ctx.fillRect(ex-7,ey-7,14,14);ctx.shadowBlur=0;ctx.strokeStyle='#fff1a8';ctx.lineWidth=2;ctx.strokeRect(ex-10,ey-10,20,20)}
marker(x*C+C/2,y*C+C/2,gen,1.18);$('gen').textContent=gen+' 号';$('time').textContent=time.toFixed(1);$('time2').textContent=time.toFixed(1)+' 秒';$('symbol').textContent=shapes[(gen-1)%8];$('symbol').style.color=colors[(gen-1)%8];$('style').textContent=names[(gen-1)%8]+' · '+colorNames[(gen-1)%8];
let seenCount = 0;
for(let i=0;i<H;i++) for(let j=0;j<W;j++) if(seen[i][j]) seenCount++;
$('reveal').textContent=(seenCount/(W*H)*100).toFixed(1)+'%';
$('steps').textContent=steps;$('count').textContent=gen;$('pos').textContent='当前位置：('+x+', '+y+') · '+(won?'已找到出口':running?'正在探索':'等待开始');$('status').textContent=won?'已找到出口！':running?'正在探索……':'等待开始'}
$('start').onclick=()=>{if(!won){running=true;note(gen+' 号继续探索。');render()}};$('pause').onclick=()=>{running=!running;note(running?'继续探索。':'探索暂停。');render()};$('new').onclick=fresh;
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{let d=b.dataset.dir.split(',').map(Number);move(d[0],d[1])});
document.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[e.key];if(d&&running&&!won){e.preventDefault();move(...d)}});

let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e=>{
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchend', e=>{
    if(!running || won) return;
    let dx = e.changedTouches[0].clientX - touchStartX;
    let dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > Math.abs(dy)){
        move(dx > 0 ? 1 : -1, 0);
    }else{
        move(0, dy > 0 ? 1 : -1);
    }
    e.preventDefault();
}, {passive: false});

function tick(t){if(!last)last=t;let dt=Math.min(.1,(t-last)/1000);last=t;if(running&&!won){time-=dt;if(time<=0){time=0;handoff()}else render()}requestAnimationFrame(tick)}
fresh();requestAnimationFrame(tick);
})();
</script></body></html>
